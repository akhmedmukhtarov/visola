version: '3.8'

services:
  app:
    image: ${IMAGE_NAME}
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
    ports:
      - ${PORT}:80
    networks:
      - network

networks:
  network:
    driver: overlay
    attachable: true
