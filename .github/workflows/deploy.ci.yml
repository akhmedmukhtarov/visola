name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/visola:main
  DEPLOY_DIR: /root/srv/visola
  STACK_NAME: visola
  APP_PORT: 88

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Creates DEPLOY_DIR on the server if it does not exist
      - name: Copy docker stack to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-stack.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy stack
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PORT=${{ env.APP_PORT }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}
            envsubst < ${{ env.DEPLOY_DIR }}/docker-stack.yml | docker stack deploy --resolve-image always --compose-file - ${{ env.STACK_NAME }}
            docker stack services ${{ env.STACK_NAME }}

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            curl -s -f --max-time 5 "http://${{ secrets.SERVER_HOST }}:${{ env.APP_PORT }}" > /dev/null && exit 0
          done
          echo "Site did not respond on port ${{ env.APP_PORT }}"
          exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Alert to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            📦 ${{ github.repository }}
            💬 ${{ github.event.commits[0].message }}
            🏗️ Build: ${{ needs.build.result }}
            🖥️ Deploy: ${{ needs.deploy.result }}
            🔗 https://github.com/${{ github.repository }}/commit/${{ github.sha }}
